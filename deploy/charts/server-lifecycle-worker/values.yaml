# server-lifecycle-worker — one release per MCE cluster, installed in that MCE.
#
# Argo CD: point one Application per MCE at this chart with that MCE as the
# destination and its own values file (see values-*.yaml beside this one). The
# chart creates no Namespace, runs no hooks and renders deterministically, so
# Argo can sync and diff it as plain manifests.

# REQUIRED. The MCE this worker serves. It names the queue the worker polls
# (server-lifecycle-activity-<mceCluster>) and MUST equal the `mce_cluster`
# callers send and the cluster_name of that MCE's INVENTORY segment in the
# Segments Manager. A wrong value is silent: the worker would serve installs
# meant for another MCE.
mceCluster: ""

replicaCount: 2

image:
  # Disconnected production: the mirror of ghcr.io/team-redbull/server-lifecycle-worker.
  repository: ghcr.io/team-redbull/server-lifecycle-worker
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The hub's Temporal frontend, as reachable FROM THIS MCE. On the hub itself
# that is the in-cluster Service; on any other MCE it is whatever exposes the
# frontend's gRPC port across clusters (a LoadBalancer, NodePort or a TLS
# passthrough Route). The worker dials OUT, so the hub needs no access to the MCE.
temporal:
  host: ""           # REQUIRED, host:port, e.g. temporal.hub.example:7233
  namespace: default # the TEMPORAL namespace (not the OpenShift project); must match the hub
  # TLS to the frontend. Required when `host` is a passthrough Route (it routes
  # by SNI, so it carries TLS only); off for a plain NodePort / in-cluster host.
  # The CA is PUBLIC — the certificate that signed the frontend's (or its TLS
  # proxy's) certificate — so it lives here in plain values, the same for every
  # MCE. The server certificate renewing changes nothing here; only replacing
  # the CA does.
  tls:
    enabled: false
    serverName: ""   # defaults to the host part of `host`
    caCert: ""
    #  -----BEGIN CERTIFICATE-----
    #  ...
    #  -----END CERTIFICATE-----

# server-scan, as reachable from this MCE. Base URL INCLUDING /api/v1.
serverScan:
  url: ""            # REQUIRED

# IPMI (UCS-managed Cisco) servers boot from the network: site -> base URL of
# that site's PXE VM. The site is the MCE inventory segment's, spelled as the
# Segments Manager spells it. Empty = UCS blades are skipped with
# PxeSiteNotConfiguredError; Redfish servers never read it.
pxeMap:
  urls: {}
  #  bat-yam: http://pxe-vm.bat-yam.example:8080

# VMs: for an InfraEnv whose agentLabels say `redbull.io/size: kv<cpu>`,
# add-server-to-mce has ONE VM made (create-vm) and installs exactly that one,
# with no draw from server-scan. Its BareMetalHost drives the VM through the
# kubevirt-redfish of the KV cluster the VM landed on. That Route's host is ONE
# pattern in which only the KV cluster's name changes: host[:port] — no scheme,
# no path — naming {kv_cluster}, the cluster's day1 file name
# (ocp4-prod-kv-five-az1-a). The Redfish system is /redfish/v1/Systems/<vm name>
# (kubevirt-redfish's `systemIdConvention: legacy`).
#
# OPTIONAL, with the credentials KUBEVIRT_BMC_USERNAME / KUBEVIRT_BMC_PASSWORD
# (the Redfish user, the same on every KV cluster): without all three, every
# bare-metal install works and a VM install fails at its first step
# (KubevirtBmcNotConfiguredError), before any VM is made.
kubevirt:
  bmcHostTemplate: ""
  #  kubevirt-redfish-kubevirt-redfish.apps.{kv_cluster}.example.com

# update-nodepool reads the cluster's day1 file and commits its NodePools'
# replicas to day1 `main` through this worker. OPTIONAL: with no repoUrl or no
# token, update-nodepool fails at once on this MCE (Day1NotConfiguredError) and
# every other workflow is unaffected.
day1:
  repoUrl: ""        # https:// only (the token is injected into https URLs)
  # Run in the clone before the push, e.g. "python3 scripts/validate_all_clusters.py".
  validateCommand: ""
  # The push token, DAY1_GIT_TOKEN: either a key of the credentials Secret
  # below, or — set here — read from an existing Secret, such as the
  # segment-lifecycle chart's `day1-git-token` where both run in one namespace.
  tokenSecret:
    name: ""
    key: DAY1_GIT_TOKEN

# Argo CD on THIS MCE, for update-nodepool's sync of the cluster's Application:
# the namespace the hcAppset renders the Applications in (rbac.yaml grants
# get/patch on Applications there), and the `ref` of their day1 values source.
argo:
  namespace: openshift-gitops
  valuesRef: values

# Secret keys the worker reads: SERVER_SCAN_API_TOKEN (ADMIN role),
# <VENDOR>_BMC_USERNAME / <VENDOR>_BMC_PASSWORD for HP, DELL, CISCO, INTERSIGHT
# and KUBEVIRT (the kubevirt-redfish user of the KV clusters, see `kubevirt`
# above), PXE_MAP_TOKEN, and DAY1_GIT_TOKEN unless day1.tokenSecret names another.
#
# With Argo CD keep credentials OUT of git: set existingSecret to a Secret made
# by Sealed Secrets / External Secrets / Vault in the same namespace. `create`
# renders one from `values` and is meant for labs only.
credentials:
  existingSecret: ""
  create: false
  values: {}
  #  SERVER_SCAN_API_TOKEN: ""
  #  CISCO_BMC_USERNAME: ""
  #  CISCO_BMC_PASSWORD: ""
  #  KUBEVIRT_BMC_USERNAME: ""
  #  KUBEVIRT_BMC_PASSWORD: ""
  #  PXE_MAP_TOKEN: ""

# Namespaces on THIS cluster where the worker may create install resources —
# the InfraEnv namespaces. One Role + RoleBinding is rendered in each; the
# namespaces themselves must already exist.
#
# hostedClusters: the hosted-cluster ClusterRole — uninstall-server-from-hc's and
# update-nodepool's: CAPI Machines, AgentMachines, HostedClusters and NodePools,
# and get on Secrets CLUSTER-WIDE (the HostedCluster's admin kubeconfig) — plus
# the Role on Argo CD Applications in argo.namespace. Turn it off on an MCE that
# runs no hosted clusters: uninstall-server-from-hc then fails its inspection of
# any host with an Agent (403, before anything is written) — use
# remove-server-from-mce there instead — and update-nodepool has nothing to scale.
rbac:
  create: true
  targetNamespaces: []
  hostedClusters: true

serviceAccount:
  create: true
  name: ""           # defaults to the release's full name

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# In-flight activities get 20s to finish after SIGTERM (worker_init.py); keep
# the pod's grace period above it.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
