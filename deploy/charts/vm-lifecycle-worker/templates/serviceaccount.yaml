{{- if .Values.serviceAccount.create }}
# The worker's identity on THIS KV cluster's API server — what replaces a
# kubeconfig, a Route and a fleet token. Its rights come only from rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vlw.serviceAccountName" . }}
  labels:
    {{- include "vlw.labels" . | nindent 4 }}
{{- end }}
