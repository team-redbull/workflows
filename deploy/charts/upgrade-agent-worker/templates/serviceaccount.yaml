# An identity with no rights: the worker never talks to a Kubernetes API.
# No Role or RoleBinding exists for it on purpose (CLAUDE.md §2).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uaw.fullname" . }}
  labels:
    {{- include "uaw.labels" . | nindent 4 }}
automountServiceAccountToken: false
