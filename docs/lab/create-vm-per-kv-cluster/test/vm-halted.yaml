# The verification VM of `lab.sh verify`: the shape create-vm makes, reduced to
# what the lab has to prove — Halted, a fixed MAC on the pod network, a blank root disk
# that binds without the VM ever starting. __NAME__ is replaced by lab.sh.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: __NAME__
  labels:
    redfish-enabled: "true"
    redbull.io/lab: create-vm
spec:
  runStrategy: Halted
  dataVolumeTemplates:
    - metadata:
        name: __NAME__-root
      spec:
        source:
          blank: {}
        pvc:
          storageClassName: ocs-external-storagecluster-cephfs
          accessModes:
            - ReadWriteMany
          volumeMode: Filesystem
          resources:
            requests:
              storage: 2Gi
  template:
    metadata:
      labels:
        redbull.io/lab: create-vm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
          interfaces:
            - name: default
              macAddress: "0e:00:63:00:00:01"
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: __NAME__-root
