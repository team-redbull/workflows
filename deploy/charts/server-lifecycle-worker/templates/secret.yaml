{{- if .Values.credentials.create }}
# LAB USE ONLY: values rendered from the chart end up in git with Argo CD.
# Production sets credentials.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slw.credentialsSecret" . }}
  labels:
    {{- include "slw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.credentials.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
