{{- if .Values.temporal.tls.enabled }}
{{- if not .Values.temporal.tls.caCert }}
{{- fail "temporal.tls.caCert is required when temporal.tls.enabled" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usw.fullname" . }}-temporal-ca
  labels:
    {{- include "usw.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.temporal.tls.caCert | trim | nindent 4 }}
{{- end }}
