# upgrade-gitops-worker — ONE release, on the hub, next to the brain.
#
# The chart creates no Namespace and no Secret: every credential comes from a
# Secret that already exists in the release's namespace, named below. It needs
# no RBAC (its ServiceAccount mounts no API token), only egress to the git
# hosts and the release registry.

# Two, as the domain's other limbs: every upgrade in the fleet commits through
# this queue, so one pod restarting should not pause them all. Safe to share:
# each activity is one fresh clone, day1 commits compare-and-set on the blob
# and Brain pages are keyed on the invocation, so two pods race like two runs.
replicaCount: 2

image:
  # Disconnected production: the mirror of ghcr.io/team-redbull/upgrade-gitops-worker.
  repository: ghcr.io/team-redbull/upgrade-gitops-worker
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The brain's global ConfigMap (TEMPORAL_HOST, TEMPORAL_NAMESPACE), mounted
# first. On the hub that is all the Temporal configuration needed; "" to not
# mount it (then temporal.host is required).
globalConfigMap: workflows-orchestrator-config

# Set to render the Temporal endpoint here instead (it then wins over the
# global ConfigMap's): for a namespace without the brain. TLS as in the
# server-lifecycle-worker chart (its README has the Route shape).
temporal:
  host: ""           # host:port
  namespace: default # the TEMPORAL namespace (not the OpenShift project)
  tls:
    enabled: false
    serverName: ""   # defaults to the host part of `host`
    caCert: ""       # the PUBLIC CA that signed the frontend's certificate

# day1 platform-config: the upgrade rules (upgrade/), the cluster files, and
# the upgrade's commits to main.
day1:
  repoUrl: ""        # REQUIRED, https:// (the token is injected into https URLs only)
  # Run in the clone before every push (D3), e.g. "python3 scripts/validate_all_clusters.py".
  # Empty: commits are pushed without it, and every commit logs that.
  validateCommand: ""
  # REQUIRED. An existing Secret holding a token that may push to main. The
  # segment-lifecycle worker's day1-git-token has the same key.
  tokenSecret:
    name: day1-git-token
    key: DAY1_GIT_TOKEN

# day2 (gitops-day2-prod): the version layers of pre-flight check 4.
# Empty repoUrl: not checked; each run's result says so.
day2:
  repoUrl: ""
  tokenSecret:       # optional: a public repo needs none
    name: ""
    key: DAY2_GIT_TOKEN

# Brain (redbull-brain): one incident page per agent verdict, pushed to main (D10).
# Empty repoUrl: verdicts stay in the run's history only; the run never waits on Brain.
brain:
  repoUrl: ""
  tokenSecret:       # required to push once repoUrl is set
    name: ""
    key: BRAIN_GIT_TOKEN

# The release registry: tags, digests, and `oc adm release info` on each pin.
registry:
  # An existing Secret holding a container auth file (a kubernetes.io/dockerconfigjson
  # pull secret works as is), mounted read-only as REGISTRY_AUTH_FILE. Empty:
  # anonymous, which quay.io's public ocp-release allows; its payload
  # repository (ocp-v4.0-art-dev) needs the pull secret, so without one every
  # pin reports the payload as unreadable and planning fails on it.
  authSecret:
    name: ""
    key: .dockerconfigjson
  # false only for a registry whose CA cannot be mounted (the internal mirror).
  tlsVerify: true

serviceAccount:
  create: true
  name: ""           # defaults to the release's full name

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # oc adm release info on several releases at once, and shallow clones.
    memory: 768Mi

# A push in flight gets 60s to land after SIGTERM (worker_init.py); keep the
# pod's grace period above it.
terminationGracePeriodSeconds: 90

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
