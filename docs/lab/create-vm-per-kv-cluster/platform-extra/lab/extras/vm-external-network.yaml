# The network every create-vm VM is built on: the platform's vm.yaml names
# `openshift-cnv/vm-external-network`, and so does the vm-lifecycle worker by default.
# In production it is a bridge onto the site's inventory VLAN (the platform's
# openshift-virtualization chart builds the node bridge, `vmBridge`). This cluster has no
# spare NIC and no kubernetes-nmstate, so here it is an OVN-Kubernetes layer2 overlay of
# the SAME name — no node change at all (the precedent: the platform's
# docs/lab-kubevirt-bmh-enrollment). Halted VMs never attach to it; it exists so the VMs
# the lab creates are exactly vm.yaml's, network included.
# `netAttachDefName` must be exactly <namespace>/<name>, or OVN-Kubernetes ignores the NAD;
# the MTU is the cluster network's (1300 on this cluster).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vm-external-network
  namespace: openshift-cnv
  labels:
    redbull.io/lab: create-vm
spec:
  config: |-
    {
      "cniVersion": "0.4.0",
      "name": "lab-vm-external-network",
      "type": "ovn-k8s-cni-overlay",
      "topology": "layer2",
      "mtu": 1300,
      "netAttachDefName": "openshift-cnv/vm-external-network"
    }
