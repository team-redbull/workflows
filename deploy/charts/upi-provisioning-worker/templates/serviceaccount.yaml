{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "upw.serviceAccountName" . }}
  labels:
    {{- include "upw.labels" . | nindent 4 }}
{{- end }}
---
# The Jobs' identity: they store the installed cluster's kubeconfig, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.installer.serviceAccount }}
  labels:
    {{- include "upw.labels" . | nindent 4 }}
