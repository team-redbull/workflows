apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cuw.fullname" . }}
  labels:
    {{- include "cuw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cuw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cuw.selectorLabels" . | nindent 8 }}
      annotations:
        # Settings are read once at import (fail-fast), so a config change
        # only takes effect through a rollout — which this checksum forces.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.temporal.tls.enabled }}
        checksum/temporal-ca: {{ include (print $.Template.BasePath "/temporal-tls-ca.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cuw.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-upgrade-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No ports and no probes: the worker serves nothing. It dials out to
          # Temporal, and a worker that cannot reach it exits and restarts.
          envFrom:
            - configMapRef:
                name: {{ include "cuw.configName" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The one thing it writes: each hosted cluster's admin CA, cert and
            # key, in a per-call temp dir deleted when the call ends
            # (server_lifecycle/hosted_cluster_api.py).
            - name: tmp
              mountPath: /tmp
            {{- if .Values.temporal.tls.enabled }}
            - name: temporal-ca
              mountPath: /etc/temporal-tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.temporal.tls.enabled }}
        - name: temporal-ca
          configMap:
            name: {{ include "cuw.fullname" . }}-temporal-ca
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
