apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-create-vm-workflows-orchestrator
  namespace: openshift-gitops
  labels:
    redbull.io/lab: create-vm
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab-create-vm
  source:
    repoURL: http://gitea-http.lab-git.svc.cluster.local:3000/redbull/platform.git
    targetRevision: main
    path: gitops/charts/workflows-orchestrator
    helm:
      releaseName: workflows-orchestrator
      valuesObject:
        # The brain (every workflow, create-vm and kv-zone-lock included) and its API, from the
        # image built on this cluster out of the feature branch. One pod each; no Route host.
        image:
          repository: image-registry.openshift-image-registry.svc:5000/redbull-workflows/workflows-orchestrator
          tag: lab
          pullPolicy: Always
        replicas: 1
        workflowsApi:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: redbull-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
