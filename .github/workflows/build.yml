name: Build and Push

# Nine images from this one repo: the workflow "brain" (workflow_domains/Dockerfile),
# seven activity worker "limbs" (activities/<limb>/Dockerfile) — segment-lifecycle,
# server-lifecycle, server-provisioning and vm-lifecycle, one per domain, and
# cluster-upgrade's three: cluster-upgrade and upgrade-agent per MCE, upgrade-gitops
# on the hub — and the documentation site (docs/Dockerfile), which carries no code at all.

# A commit message containing "[skip ci]" (or "[ci skip]", "[no ci]", "[skip actions]")
# makes GitHub skip this WHOLE workflow, the `changes` job included, and the next push
# builds only what ITS OWN range touched. So a skipped push leaves its images unbuilt
# until a later push touches their paths, which can ship a new brain against an old
# limb. Never quote the marker in a commit message; if it happens anyway, re-trigger by
# pushing a change to this file, which rebuilds every image.
#
# The same holds for a push whose `test` job failed: re-running it builds that push's images,
# but a later commit that only fixes tests builds nothing, because its own range touched no
# image. Re-trigger the same way.

on:
  push:
    branches: [ '**' ]
  delete:

permissions:
  contents: write
  packages: write

jobs:
  # Which images does this push actually affect? Without this, EVERY push
  # rebuilt, re-tagged and redeployed all of them — a CSS tweak in docs/ rolled
  # the orchestrator and the worker pods for an image whose content had not
  # changed at all.
  #
  # Per-JOB filtering, so it cannot be `on.push.paths`: that gates the whole
  # workflow, which is the opposite of what is wanted when independent images
  # share one file. Hence a cheap job that diffs the push range and
  # publishes a boolean per image.
  #
  # Plain git rather than a marketplace filter action: no third-party
  # dependency in the path that decides what reaches production, and the
  # edge cases are explicit below.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      brain: ${{ steps.filter.outputs.brain }}
      limb:  ${{ steps.filter.outputs.limb }}
      docs:  ${{ steps.filter.outputs.docs }}
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need both ends of the range to diff them
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Three ways to establish what this push changed, in order of
          # precision. The fallbacks matter: the obvious "no base → build
          # everything" rule sounds safe but fires on the FIRST push of every
          # new branch (github.event.before is all-zeros there), which turns
          # an ordinary "branch, tweak docs, push" into every image.
          all=false
          if [ -n "${BEFORE}" ] \
             && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="${BEFORE}"
            echo "base: push range from ${BEFORE}"
          elif [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ] \
               && base="$(git merge-base "origin/${DEFAULT_BRANCH}" "${GITHUB_SHA}" 2>/dev/null)" \
               && [ -n "${base}" ]; then
            # New or rewritten branch: everything it adds on top of the
            # default branch IS its change set, which is both well defined
            # and exactly what we want to test.
            echo "base: branch point off ${DEFAULT_BRANCH} (${base})"
          else
            # Only reachable when the default branch itself has no usable
            # base — i.e. it was force-pushed. Rare, and rebuilding everything
            # is the right answer there: a skipped build that was needed
            # ships a stale image to PROD and is invisible, whereas a
            # redundant build only costs minutes.
            echo "no usable base on ${GITHUB_REF_NAME} — building everything"
            all=true
            changed=""
          fi

          if [ "${all}" = false ]; then
            changed="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
            echo "changed files:"
            printf '%s\n' "${changed}" | sed 's/^/  /'
          fi

          match() {
            if [ "${all}" = true ]; then echo true; return; fi
            if printf '%s\n' "${changed}" | grep -qE "$1"; then echo true; else echo false; fi
          }

          # Paths mirror each Dockerfile's COPY set, NOT the folder that
          # happens to share the image's name:
          #   · every Python image bakes in shared/, so it triggers them all;
          #   · EACH limb copies the WHOLE activities/ tree, not just its own
          #     domain — which is why one `limb` flag drives all seven limb jobs;
          #   · this file changes what gets built, so it triggers everything.
          # `charts` is no image: the per-MCE charts sync-upgrade-charts copies
          # into redbull-platform, and the script that copies them.
          SELF='\.github/workflows/build\.yml$'
          {
            echo "brain=$(match "^(workflow_domains/|shared/|${SELF})")"
            echo "limb=$(match "^(activities/|shared/|${SELF})")"
            echo "docs=$(match "^(docs/|${SELF})")"
            echo "charts=$(match "^(deploy/charts/(cluster-upgrade-worker|upgrade-agent-worker)/|scripts/sync_platform_charts\.sh$|${SELF})")"
          } | tee -a "${GITHUB_OUTPUT}"

  # The suite runs on EVERY push, and every image job needs it: a red test never
  # becomes an image, and never reaches redbull-platform's main (which deploys). It
  # includes tests/test_conventions.py, the mechanical half of CLAUDE.md, so a
  # convention slip is a red run here, not a workflow stuck RUNNING in production.
  # A couple of minutes, so not worth a path filter: a docs-only push pays it too.
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # what the Python images run
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-workflow-brain:
    # `test` gates the whole chain: a failing suite skips this job, and the
    # `!failure()` guards behind it then skip every job that follows.
    needs: [changes, test]
    if: ${{ needs.changes.outputs.brain == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      # Named for the Argo service / Deployment it becomes, not for this repo:
      # the image, the chart directory and the running Deployment all read
      # `workflows-orchestrator`. Was plain `workflows` (the repo name), which
      # matched nothing that runs in the cluster.
      image-name: workflows-orchestrator
      dockerfile: workflow_domains/Dockerfile
      # Chart lives in the redbull-platform repo now (Argo CD). The bump + tag land
      # there, in gitops/charts/<service>/.
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/workflows-orchestrator/values.yaml
      helm-image-path: image
    secrets: inherit

  build-segment-lifecycle-worker:
    # Kept sequential after the brain: both now push to the same redbull-platform
    # branch, so running them in parallel makes them race on that push. (Their VERSION
    # sequences no longer collide — tags there are namespaced per chart directory — but
    # the branch is still one branch.)
    #
    # The two status guards are what let the chain SURVIVE a skip: a job whose
    # `needs` was skipped is itself skipped by default, so without a status
    # function in `if` a docs-only push would skip the brain and then everything
    # queued behind it — including docs. `!failure()` keeps the old behaviour in
    # the case that matters: a genuine failure upstream still stops the chain.
    needs: [changes, build-workflow-brain]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.limb == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: segment-lifecycle-worker
      dockerfile: activities/segment_lifecycle/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/segment-lifecycle-worker/values.yaml
      helm-image-path: activityWorker.image
    secrets: inherit

  build-server-lifecycle-worker:
    # The add-server-to-mce limb. Sequential behind the segment-lifecycle one for
    # the same reason that one is behind the brain: both push to the same
    # redbull-platform branch, so running them together makes them race.
    #
    # Shares the `limb` flag with every other limb deliberately — each limb
    # Dockerfile COPYs the whole activities/ tree, so a change under any
    # domain really does land in every limb image.
    needs: [changes, build-segment-lifecycle-worker]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.limb == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: server-lifecycle-worker
      dockerfile: activities/server_lifecycle/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/server-lifecycle-worker/values.yaml
      helm-image-path: activityWorker.image
    secrets: inherit

  build-workflows-docs:
    # Same sequential chain as the others — see build-segment-lifecycle-worker for why.
    # Last in the chain, so it is the job that most needed the skip guards —
    # a docs-only push skips every job ahead of it.
    needs: [changes, build-server-lifecycle-worker]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.docs == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      # The docs site. Its own Argo service (workflows-docs) rather than a page
      # bolted onto the API pod: it is static, holds no credentials and must stay
      # readable when the orchestrator itself is down or being redeployed.
      image-name: workflows-docs
      dockerfile: docs/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/workflows-docs/values.yaml
      helm-image-path: image
    secrets: inherit

  build-server-provisioning-worker:
    # The provision-dell-server limb. It went LAST in the chain while its chart
    # (gitops/charts/server-provisioning-worker/ in redbull-platform) did not exist, so
    # the failing bump could not stop the docs. The chart exists now; the job could move
    # back beside the other limbs.
    needs: [changes, build-workflows-docs]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.limb == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: server-provisioning-worker
      dockerfile: activities/server_provisioning/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/server-provisioning-worker/values.yaml
      helm-image-path: activityWorker.image
    secrets: inherit

  # cluster-upgrade's three limbs. Their charts are in redbull-platform since 2026-11-02:
  # cluster-upgrade-worker and upgrade-agent-worker (per MCE) as copies of deploy/charts/
  # here that sync-upgrade-charts keeps equal, upgrade-gitops-worker (hub) only there.
  # Each main build gets a vX.Y.Z tag, the bump of image.tag in that chart's values.yaml
  # and a <chart>/vX.Y.Z tag there, like every other image; a branch build stays
  # <branch-slug>-<short sha>. None of the three has a gitops/services/ entry yet, so
  # their bumps deploy nothing. Sequential, at the end, for the reason
  # build-segment-lifecycle-worker gives.
  sync-upgrade-charts:
    # Copies deploy/charts/{cluster-upgrade-worker,upgrade-agent-worker} into
    # redbull-platform on a main push that changes them, so nobody keeps the two
    # copies equal by hand (scripts/sync_platform_charts.sh: the whole chart, keeping
    # the image tag and chart version the build jobs wrote there). Renders both the way
    # Argo would, then commits and pushes. BEFORE the image jobs, so a push that changes
    # a chart and the code ships the chart first: a new key before the image that needs
    # it (CLAUDE.md §8). Same token and same rebase-and-retry push as ghcr-build-push.yml.
    needs: [changes, build-server-provisioning-worker]
    if: ${{ !cancelled() && !failure() && github.ref_name == 'main' && needs.changes.outputs.charts == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: team-redbull/redbull-platform
          token: ${{ secrets.REDBULL_WRITE_TOKEN }}
          path: _platform
          fetch-depth: 0
      - name: Copy the charts
        run: bash scripts/sync_platform_charts.sh _platform
      # Offline: a runner cannot reach a cluster, so lint and template, with the
      # values the charts require (redbull-platform's CLAUDE.md: a server dry-run is
      # the full check, done by hand before an Application points at them).
      - name: Render them
        run: |
          set -euo pipefail
          cd _platform/gitops/charts
          common=(--set mceCluster=ocp4-ci --set temporal.host=temporal-frontend:7233)
          helm lint cluster-upgrade-worker "${common[@]}"
          helm template cluster-upgrade-worker cluster-upgrade-worker "${common[@]}" >/dev/null
          helm lint upgrade-agent-worker "${common[@]}" --set upgradeAgent.url=http://upgrade-agent:8080
          helm template upgrade-agent-worker upgrade-agent-worker "${common[@]}" --set upgradeAgent.url=http://upgrade-agent:8080 >/dev/null
      - name: Commit and push
        run: |
          set -euo pipefail
          cd _platform
          git add gitops/charts/cluster-upgrade-worker gitops/charts/upgrade-agent-worker
          if git diff --cached --quiet; then
            echo "redbull-platform's copies already match ${GITHUB_SHA::7}"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync cluster-upgrade per-MCE charts from workflows@${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase origin/main || { echo "rebase failed; a human needs to look"; exit 1; }
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after 5 attempts"
          exit 1

  build-cluster-upgrade-worker:
    # The per-MCE limb (activities/cluster_upgrade/), the workflow ServiceAccount.
    needs: [changes, sync-upgrade-charts]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.limb == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: cluster-upgrade-worker
      dockerfile: activities/cluster_upgrade/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/cluster-upgrade-worker/values.yaml
      helm-image-path: image
    secrets: inherit

  build-upgrade-agent-worker:
    # The per-MCE agent limb (activities/upgrade_agent/): calls the upgrade agent service.
    needs: [changes, build-cluster-upgrade-worker]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.limb == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: upgrade-agent-worker
      dockerfile: activities/upgrade_agent/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/upgrade-agent-worker/values.yaml
      helm-image-path: image
    secrets: inherit

  build-upgrade-gitops-worker:
    # The hub limb (activities/upgrade_gitops/: git, oc, the registry).
    needs: [changes, build-upgrade-agent-worker]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.limb == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: upgrade-gitops-worker
      dockerfile: activities/upgrade_gitops/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/upgrade-gitops-worker/values.yaml
      helm-image-path: image
    secrets: inherit

  build-vm-lifecycle-worker:
    # The create-vm limb (activities/vm_lifecycle/). LAST in the chain on purpose: its chart
    # (gitops/charts/vm-lifecycle-worker/ in redbull-platform) is not on that repo's main
    # yet, so the image-tag bump fails until it lands, and a failure here must not stop any
    # other image. It could move beside the other hub limbs once the chart is there.
    needs: [changes, build-upgrade-gitops-worker]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.limb == 'true' }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: vm-lifecycle-worker
      dockerfile: activities/vm_lifecycle/Dockerfile
      chart-repo: team-redbull/redbull-platform
      helm-values-path: gitops/charts/vm-lifecycle-worker/values.yaml
      helm-image-path: activityWorker.image
    secrets: inherit

  cleanup-workflow-brain-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: workflows-orchestrator
    secrets: inherit

  cleanup-segment-lifecycle-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: segment-lifecycle-worker
    secrets: inherit

  cleanup-server-lifecycle-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: server-lifecycle-worker
    secrets: inherit

  cleanup-server-provisioning-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: server-provisioning-worker
    secrets: inherit

  cleanup-upgrade-agent-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: upgrade-agent-worker
    secrets: inherit

  cleanup-upgrade-gitops-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: upgrade-gitops-worker
    secrets: inherit

  cleanup-workflows-docs-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: workflows-docs
    secrets: inherit

  cleanup-cluster-upgrade-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: cluster-upgrade-worker
    secrets: inherit

  cleanup-vm-lifecycle-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: vm-lifecycle-worker
    secrets: inherit
