{{- if .Values.temporal.tls.enabled }}
{{- if not .Values.temporal.tls.caCert }}
{{- fail "temporal.tls.caCert is required when temporal.tls.enabled: the CA that signed the frontend's certificate" }}
{{- end }}
# The CA the worker verifies the hub's Temporal endpoint against. Public data,
# hence a ConfigMap; mounted as a file because the SDK reads it once at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slw.fullname" . }}-temporal-ca
  labels:
    {{- include "slw.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- .Values.temporal.tls.caCert | trim | nindent 4 }}
{{- end }}
