{{- include "ugw.validate" . -}}
# Everything this worker reads that is not a credential (shared/settings.py
# UpgradeGitopsActivitySettings). The Temporal endpoint comes from the brain's
# global ConfigMap unless temporal.host is set here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ugw.configName" . }}
  labels:
    {{- include "ugw.labels" . | nindent 4 }}
data:
  {{- if .Values.temporal.host }}
  TEMPORAL_HOST: {{ .Values.temporal.host | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  {{- if .Values.temporal.tls.enabled }}
  TEMPORAL_TLS_CA: /etc/temporal-tls/ca.crt
  TEMPORAL_TLS_SERVER_NAME: {{ .Values.temporal.tls.serverName | default (first (splitList ":" .Values.temporal.host)) | quote }}
  {{- end }}
  {{- end }}
  DAY1_REPO_URL: {{ .Values.day1.repoUrl | quote }}
  DAY1_VALIDATE_COMMAND: {{ .Values.day1.validateCommand | quote }}
  DAY2_REPO_URL: {{ .Values.day2.repoUrl | quote }}
  BRAIN_REPO_URL: {{ .Values.brain.repoUrl | quote }}
  {{- if .Values.registry.authSecret.name }}
  REGISTRY_AUTH_FILE: /etc/registry-auth/auth.json
  {{- end }}
  REGISTRY_TLS_VERIFY: {{ .Values.registry.tlsVerify | quote }}
  COMMIT_AUTHOR_NAME: {{ .Values.commitAuthor.name | quote }}
  COMMIT_AUTHOR_EMAIL: {{ .Values.commitAuthor.email | quote }}
