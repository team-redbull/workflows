# The lab's fake KV clusters (tests/kv_fleet.py), as one pod: plain manifests from the
# lab repo's lab/kv-fleet. See platform-extra/lab/kv-fleet/deployment.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-create-vm-kv-fleet
  namespace: openshift-gitops
  labels:
    redbull.io/lab: create-vm
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab-create-vm
  source:
    repoURL: http://gitea-http.lab-git.svc.cluster.local:3000/redbull/platform.git
    targetRevision: main
    path: lab/kv-fleet
  destination:
    server: https://kubernetes.default.svc
    namespace: redbull-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
