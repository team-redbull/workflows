name: Build and Push

# Ten images from this one repo: the workflow "brain" (workflow_domains/Dockerfile),
# eight activity worker "limbs" (activities/<limb>/Dockerfile) — segment-lifecycle,
# server-lifecycle, server-provisioning, vm-lifecycle and cluster-lifecycle, one per
# domain, and cluster-upgrade's three: cluster-upgrade and upgrade-agent per MCE,
# upgrade-gitops on the hub — and the documentation site (docs/Dockerfile), which
# carries no code at all.

# The job graph. `changes` decides which images this push builds and `test` runs the
# suite; nothing is built or bumped until both pass. Every image is a row of
# .github/image-builds.json, the reusable workflow's inputs for it, so this file holds
# none. The brain's row builds FIRST, on its own (`build-workflow-brain`): it is deployed
# before any limb (CLAUDE.md §5). Beside it, `sync-upgrade-charts` ships the per-MCE
# charts before their images. Then `build` builds every other changed image AT ONCE, one
# matrix job per row; one image's failure stops no other. A push that does not touch the
# brain starts `build` straight after `test`. Last, `release-notes` writes what the run
# shipped, image by image, and on `main` `release` publishes it as a GitHub Release.
#
#   changes ─┐
#   test ────┴─┬─ build-workflow-brain ─┐
#              └─ sync-upgrade-charts ──┴─ build (one job per changed image, in parallel)
#                                                └─ release-notes ── release (main)

# An image is built only when a file IT LOADS changed (scripts/image_changes.py follows
# the imports from each image's entrypoint), so most pushes build one or two images.
# That precision would make a missed build permanent: an image nobody touches again is
# never rebuilt. So `changes` measures the change since the last push on this branch
# whose WHOLE run succeeded, not since the previous push. A push whose `test` or image
# job failed, and a push GitHub skipped because its commit message contained "[skip ci]"
# (or "[ci skip]", "[no ci]", "[skip actions]"), are therefore picked up by the next
# push, whatever that one touches. Still never quote the marker in a commit message: the
# skipped push's images wait for that next push.
#
# This file is no image's input: a change here, to scripts/image_changes.py or to the
# notes rebuilds nothing (the operator, 2026-11-16: a CI-only change used to give every
# image a new version with the same contents). A change to .github/image-builds.json
# rebuilds the images whose row changed. To rebuild every image on purpose, change
# .dockerignore, which every image's build reads.

on:
  push:
    branches: [ '**' ]
  delete:

# Each job names the permissions it needs, and nothing else gets any.
permissions: {}

# One build run per branch at a time. Two main runs at once both read the same latest
# `<chart>/vX.Y.Z` tag in redbull-platform before either pushed its own, so both would
# publish the same version of an image. GitHub keeps at most ONE run waiting per group
# and cancels an older waiting one; nothing is lost by that, because `changes` measures
# from the last run that succeeded, so the newer run builds the cancelled one's change too.
# A delete event is never queued or cancelled: its group is its own run.
concurrency:
  group: ${{ github.event_name == 'push' && format('build-{0}', github.ref) || format('delete-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Which images does this push actually affect? Without this, EVERY push
  # rebuilt, re-tagged and redeployed all of them — a CSS tweak in docs/ rolled
  # the orchestrator and the worker pods for an image whose content had not
  # changed at all.
  #
  # Per-JOB filtering, so it cannot be `on.push.paths`: that gates the whole
  # workflow, which is the opposite of what is wanted when independent images
  # share one file. Hence a cheap job that diffs the push range and
  # publishes the list of images to build.
  #
  # Plain git rather than a marketplace filter action: no third-party
  # dependency in the path that decides what reaches production, and the
  # edge cases are explicit below.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read              # the last successful run on this branch (the diff base)
    outputs:
      # A JSON list of the image names to build, e.g. ["cluster-lifecycle-worker"].
      images: ${{ steps.filter.outputs.images }}
      # The two build matrices, both that list's rows in .github/image-builds.json:
      # `first`, the brain's row when the brain is in the list (`build-workflow-brain`),
      # and `matrix`, every other listed image's (`build`). Each is '' when it has no
      # row (GitHub refuses an empty matrix, so its job is skipped on ''). A new image
      # adds a row there, no output here.
      first: ${{ steps.filter.outputs.first }}
      matrix: ${{ steps.filter.outputs.matrix }}
      charts: ${{ steps.filter.outputs.charts }}
      # For `release-notes`: the diff base this job measured from ('' when it had none
      # and built every image), and the newest release of every image BEFORE anything
      # builds ('' when it could not be read).
      base: ${{ steps.filter.outputs.base }}
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # need both ends of the range to diff them
          persist-credentials: false
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Four ways to establish what this push changed, in order of
          # preference. The fallbacks matter: the obvious "no base → build
          # everything" rule sounds safe but fires on the FIRST push of every
          # new branch (github.event.before is all-zeros there), which turns
          # an ordinary "branch, tweak docs, push" into every image.
          #
          # First choice: the head of the last push on THIS branch whose whole
          # run succeeded. Everything since then is not yet built for certain —
          # a run that failed, a push GitHub skipped — so it all counts as this
          # push's change (the header says why). It must still be an ancestor:
          # after a force-push it is not, and the next rule takes over.
          all=false
          last_good="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow build.yml \
                         --branch "${GITHUB_REF_NAME}" --event push --status success \
                         --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -n "${last_good}" ] \
             && [ "${last_good}" != "${GITHUB_SHA}" ] \
             && git cat-file -e "${last_good}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "${last_good}" "${GITHUB_SHA}"; then
            base="${last_good}"
            echo "base: the last successful run on ${GITHUB_REF_NAME} (${last_good})"
          elif [ -n "${BEFORE}" ] \
             && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="${BEFORE}"
            echo "base: push range from ${BEFORE}"
          elif [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ] \
               && base="$(git merge-base "origin/${DEFAULT_BRANCH}" "${GITHUB_SHA}" 2>/dev/null)" \
               && [ -n "${base}" ]; then
            # New or rewritten branch: everything it adds on top of the
            # default branch IS its change set, which is both well defined
            # and exactly what we want to test.
            echo "base: branch point off ${DEFAULT_BRANCH} (${base})"
          else
            # Only reachable when the default branch itself has no usable
            # base — i.e. it was force-pushed. Rare, and rebuilding everything
            # is the right answer there: a skipped build that was needed
            # ships a stale image to PROD and is invisible, whereas a
            # redundant build only costs minutes.
            echo "no usable base on ${GITHUB_REF_NAME} — building everything"
            all=true
            base=""
            changed=""
          fi

          if [ "${all}" = false ]; then
            changed="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
            echo "changed files:"
            printf '%s\n' "${changed}" | sed 's/^/  /'
          fi

          # Which images? scripts/image_changes.py: the files each image LOADS,
          # followed from its entrypoint through the imports, against the changed
          # files. Its reasons go to the log. If it cannot answer — it crashed,
          # or there is no base — EVERY image is built: a red `changes` job would
          # skip every build, and the images it left unbuilt would be
          # nobody's until they changed again. Every image is a row of
          # .github/image-builds.json (tests/test_image_changes.py). `--base` lets the
          # script compare that file's rows with the base's: a changed row is that
          # image's change, and nothing else in the file is anyone's.
          every_image() {
            jq -c '[.[]["image-name"]]' .github/image-builds.json
          }
          if [ "${all}" = true ]; then
            images="$(every_image)"
          elif ! images="$(printf '%s\n' "${changed}" | python3 scripts/image_changes.py --base "${base}")"; then
            echo "::warning::scripts/image_changes.py failed — building every image"
            images="$(every_image)"
          fi

          # The two matrices: the same script maps those names to their rows in
          # .github/image-builds.json, so they are its answer, never a second decision
          # here. It reads only that file, never the import graph, so it serves the
          # every-image fallback too. It fails on a name without a row (an image
          # nothing would build), and a red `changes` builds nothing.
          first="$(printf '%s' "${images}" | python3 scripts/image_changes.py --first)"
          matrix="$(printf '%s' "${images}" | python3 scripts/image_changes.py --matrix)"

          # `charts` is no image: the per-MCE charts sync-upgrade-charts copies
          # into redbull-platform, and the script that copies them.
          charts=false
          if [ "${all}" = true ] || grep -qE '^(deploy/charts/(cluster-upgrade-worker|upgrade-agent-worker)/|scripts/sync_platform_charts\.sh$|\.github/workflows/build\.yml$)' <<<"${changed}"; then
            charts=true
          fi
          {
            echo "images=${images}"
            echo "first=${first}"
            echo "matrix=${matrix}"
            echo "charts=${charts}"
            echo "base=${base}"
          } | tee -a "${GITHUB_OUTPUT}"
      # The version every image is at before this run builds anything: redbull-platform's
      # newest `<chart>/vX.Y.Z` tags (public, read without a token). `release-notes` reads
      # them again after the builds, and an image whose tag moved is what this run
      # released. Never fails the job: unreadable, the notes say the versions before the
      # run are unknown, and every build still runs.
      - id: versions
        run: |
          if ! versions="$(python3 scripts/release_notes.py versions)"; then
            echo "::warning::the release versions before the run are unreadable — the notes cannot tell a failed build"
            versions=""
          fi
          echo "versions=${versions}" | tee -a "${GITHUB_OUTPUT}"

  # The suite runs on EVERY push, and every image job needs it: a red test never
  # becomes an image, and never reaches redbull-platform's main (which deploys). It
  # includes tests/test_conventions.py, the mechanical half of CLAUDE.md, so a
  # convention slip is a red run here, not a workflow stuck RUNNING in production.
  # A couple of minutes, so not worth a path filter: a docs-only push pays it too.
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"        # what the Python images run
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-workflow-brain:
    # FIRST, and alone: every other image's job waits for this one. A new brain is
    # deployed before the limb whose old payloads it must still read (CLAUDE.md §5,
    # "brain image before limbs"); a brain that failed to ship keeps every limb back.
    # A push that does not touch the brain skips this job, and `build` starts at once.
    # `test` gates it: a failing suite skips this job, and the `!failure()` guard
    # behind it then skips `build`.
    #
    # A one-row matrix, the brain's row of .github/image-builds.json (`--first`), so its
    # inputs live beside every other image's and a change to them is the brain's change.
    # The image is named for the Argo service / Deployment it becomes, not for this
    # repo: the image, the chart directory and the running Deployment all read
    # `workflows-orchestrator`.
    name: build ${{ matrix.image-name }}
    needs: [changes, test]
    if: ${{ needs.changes.outputs.first != '' }}
    permissions:
      contents: write             # what the reusable workflow declares; it pushes to
      packages: write             # GHCR with this token, to redbull-platform with its own
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.first) }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      chart-repo: ${{ matrix.chart-repo }}
      helm-values-path: ${{ matrix.helm-values-path }}
      helm-image-path: ${{ matrix.helm-image-path }}
    secrets: inherit

  # cluster-upgrade's three limbs. Their charts are in redbull-platform since 2026-11-02:
  # cluster-upgrade-worker and upgrade-agent-worker (per MCE) as copies of deploy/charts/
  # here that sync-upgrade-charts keeps equal, upgrade-gitops-worker (hub) only there.
  # Each main build gets a vX.Y.Z tag, the bump of image.tag in that chart's values.yaml
  # and a <chart>/vX.Y.Z tag there, like every other image; a branch build stays
  # <branch-slug>-<short sha>. None of the three has a gitops/services/ entry yet, so
  # their bumps deploy nothing. All three are rows of the `build` matrix.
  sync-upgrade-charts:
    # Copies deploy/charts/{cluster-upgrade-worker,upgrade-agent-worker} into
    # redbull-platform on a main push that changes them, so nobody keeps the two
    # copies equal by hand (scripts/sync_platform_charts.sh: the whole chart, keeping
    # the image tag and chart version the build jobs wrote there). Renders both the way
    # Argo would, then commits and pushes. BEFORE the images: `build` waits for it, so
    # a push that changes a chart and the code ships the chart first: a new key before
    # the image that needs it (CLAUDE.md §8). Beside the brain job, which does not need
    # it. Same token and same rebase-and-retry push as ghcr-build-push.yml.
    needs: [changes, test]
    if: ${{ github.ref_name == 'main' && needs.changes.outputs.charts == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keeps its credential: the job pushes to redbull-platform with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: team-redbull/redbull-platform
          token: ${{ secrets.REDBULL_WRITE_TOKEN }}
          path: _platform
          fetch-depth: 0
      - name: Copy the charts
        run: bash scripts/sync_platform_charts.sh _platform
      # Offline: a runner cannot reach a cluster, so lint and template, with the
      # values the charts require (redbull-platform's CLAUDE.md: a server dry-run is
      # the full check, done by hand before an Application points at them).
      - name: Render them
        run: |
          set -euo pipefail
          cd _platform/gitops/charts
          common=(--set mceCluster=ocp4-ci --set temporal.host=temporal-frontend:7233)
          helm lint cluster-upgrade-worker "${common[@]}"
          helm template cluster-upgrade-worker cluster-upgrade-worker "${common[@]}" >/dev/null
          helm lint upgrade-agent-worker "${common[@]}" --set upgradeAgent.url=http://upgrade-agent:8080
          helm template upgrade-agent-worker upgrade-agent-worker "${common[@]}" --set upgradeAgent.url=http://upgrade-agent:8080 >/dev/null
      - name: Commit and push
        run: |
          set -euo pipefail
          cd _platform
          git add gitops/charts/cluster-upgrade-worker gitops/charts/upgrade-agent-worker
          if git diff --cached --quiet; then
            echo "redbull-platform's copies already match ${GITHUB_SHA::7}"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync cluster-upgrade per-MCE charts from workflows@${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase origin/main || { echo "rebase failed; a human needs to look"; exit 1; }
            sleep $((RANDOM % 5 + 2))
          done
          echo "could not push after 5 attempts"
          exit 1

  build:
    # Every image but the brain, one job each, side by side: the eight limbs and the
    # docs site, each a row of .github/image-builds.json (the reusable workflow's
    # inputs), and only the rows of this push's images (`changes`, from
    # scripts/image_changes.py --matrix; the brain's row is `build-workflow-brain`'s). Until 2026-11-16 they were ten jobs in one
    # sequential chain, each waiting for the one before, so a run that built every
    # image took the sum of their builds and one failure skipped every job behind it.
    #
    # fail-fast off: a failing image cancels no other. It stays unbuilt until a later
    # push, which measures from the last run that succeeded and so builds it again.
    #
    # At most three at a time, because each job's last step pushes its bump to the same
    # redbull-platform `main`. The reusable workflow retries a rejected push five times
    # on a rebase; with n jobs pushing together, one loses at most n-1 times, so three
    # stay well inside that and leave room for another repo's push. Nine images are three
    # rounds either way at three or at four; more waits on a sturdier retry there.
    #
    # `!cancelled() && !failure()`: a job whose `needs` was skipped is itself skipped by
    # default, so without a status function a push that does not touch the brain would
    # skip every image. `!failure()` still stops on a real failure upstream: a red `test`,
    # a brain that did not ship, charts that did not sync.
    name: build ${{ matrix.image-name }}
    needs: [changes, test, build-workflow-brain, sync-upgrade-charts]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.matrix != '' }}
    permissions:
      contents: write             # what the reusable workflow declares; it pushes to
      packages: write             # GHCR with this token, to redbull-platform with its own
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: team-redbull/.github/.github/workflows/ghcr-build-push.yml@main
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      chart-repo: ${{ matrix.chart-repo }}
      helm-values-path: ${{ matrix.helm-values-path }}
      helm-image-path: ${{ matrix.helm-image-path }}
    secrets: inherit

  # What this run shipped, for whoever mirrors the images into the air-gap: every image
  # it rebuilt (its new version, the one it replaces, its digest, the commits that
  # changed it) and every image it did not (the version it stays at, with its digest).
  # scripts/release_notes.py is handed `changes`' list and never decides a second time
  # which images were built; it attributes each commit of the range to the images it
  # affects with scripts/image_changes.py's own rule. Versions are redbull-platform's
  # `<chart>/vX.Y.Z` tags, read before the builds (`changes`) and after them (here), so
  # an image whose build failed is listed as not released, at the version it stays at.
  # The notes are the run's summary page on every branch; `release` publishes them on
  # `main`.
  #
  # It runs whatever the builds did (`!cancelled()`), and never fails the run
  # (`continue-on-error`): `changes` measures from the last run that SUCCEEDED, so a red
  # notes job would make the next push rebuild, and re-version, every image this run
  # already shipped. Read-only: it holds no token that can write anything.
  release-notes:
    needs: [changes, test, build-workflow-brain, build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.test.result == 'success' && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      released: ${{ steps.notes.outputs.released }}
      tag: ${{ steps.notes.outputs.tag }}
      title: ${{ steps.notes.outputs.title }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the commits since the diff base
          persist-credentials: false
      - id: notes
        env:
          IMAGES: ${{ needs.changes.outputs.images }}
          BASE: ${{ needs.changes.outputs.base }}
          BEFORE: ${{ needs.changes.outputs.versions }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py notes --head "${GITHUB_SHA}" --ref "${GITHUB_REF_NAME}" \
            --images "${IMAGES}" --base "${BASE}" --before "${BEFORE}" \
            --repo "${GITHUB_REPOSITORY}" --run-url "${RUN_URL}" \
            --notes-file "${RUNNER_TEMP}/notes.md" --github-output "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/notes.md" >> "${GITHUB_STEP_SUMMARY}"

  # On `main`, a run that released at least one image becomes a GitHub Release of this
  # repo: tag `release-<date>-<short sha>` on the commit the run built (the commit's own
  # date, so the tag depends on the commit alone), the notes above as its text.
  # Re-running the run's failed jobs therefore rewrites the same release, now with the
  # images that shipped on the re-run. This job runs none of the repo's code: the job
  # that does holds no write token.
  release:
    needs: [release-notes]
    if: ${{ !cancelled() && github.ref_name == 'main' && needs.release-notes.outputs.released != '' && needs.release-notes.outputs.released != '0' }}
    runs-on: ubuntu-latest
    continue-on-error: true       # as release-notes: a red run would rebuild what shipped
    permissions:
      contents: write             # the tag and the release
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-notes.outputs.tag }}
          TITLE: ${{ needs.release-notes.outputs.title }}
          NOTES: ${{ needs.release-notes.outputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/notes.md"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TITLE}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

  cleanup-workflow-brain-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: workflows-orchestrator
    secrets: inherit

  cleanup-segment-lifecycle-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: segment-lifecycle-worker
    secrets: inherit

  cleanup-server-lifecycle-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: server-lifecycle-worker
    secrets: inherit

  cleanup-server-provisioning-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: server-provisioning-worker
    secrets: inherit

  cleanup-upgrade-agent-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: upgrade-agent-worker
    secrets: inherit

  cleanup-upgrade-gitops-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: upgrade-gitops-worker
    secrets: inherit

  cleanup-workflows-docs-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: workflows-docs
    secrets: inherit

  cleanup-cluster-upgrade-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: cluster-upgrade-worker
    secrets: inherit

  cleanup-vm-lifecycle-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: vm-lifecycle-worker
    secrets: inherit

  cleanup-cluster-lifecycle-worker-on-delete:
    if: github.event_name == 'delete'
    uses: team-redbull/.github/.github/workflows/ghcr-cleanup-on-delete.yml@main
    with:
      image-name: cluster-lifecycle-worker
    secrets: inherit
