{{- if .Values.serviceAccount.create }}
# The workflow identity on THIS MCE's API server (DESIGN §2) — what replaces a
# kubeconfig. Its rights come only from rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cuw.serviceAccountName" . }}
  labels:
    {{- include "cuw.labels" . | nindent 4 }}
{{- end }}
