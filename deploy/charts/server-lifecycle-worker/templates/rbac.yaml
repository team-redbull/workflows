{{- if .Values.rbac.create }}
{{- $root := . }}
{{- range $ns := .Values.rbac.targetNamespaces }}
---
# Exactly the verbs add-server-to-mce's activities use in one InfraEnv namespace:
# creating and tearing down a candidate's three resources, the Agent poll, and
# the InfraEnv read an IPMI server's network boot needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "slw.fullname" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "slw.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: [metal3.io]
    resources: [baremetalhosts]
    verbs: [get, create, delete, patch]
  - apiGroups: [agent-install.openshift.io]
    resources: [nmstateconfigs]
    verbs: [get, create, delete]
  - apiGroups: [agent-install.openshift.io]
    resources: [agents]
    # delete: remove-server-from-mce; patch: uninstall-server-from-hc releasing an Agent the
    # provider no longer can (its Machine or AgentMachine gone)
    verbs: [get, list, delete, patch]
  - apiGroups: [agent-install.openshift.io]
    resources: [infraenvs]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "slw.fullname" $root }}
  namespace: {{ $ns }}
  labels:
    {{- include "slw.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "slw.fullname" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "slw.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- if .Values.rbac.hostedClusters }}
---
# uninstall-server-from-hc's reads of a hosted cluster, and its writes there. Cluster-wide
# because what it touches lives in each hosted cluster's control-plane
# namespace (`<hc-ns>-<hc>`) and the HostedCluster's own namespace — neither
# is an InfraEnv namespace, and neither is named in the request:
#   * machines            get + delete the Machine behind the Agent; list to
#                         find it by providerID or infrastructureRef when its
#                         AgentMachine is gone; patch to remove the Agent
#                         provider's pre-terminate hook from such a Machine,
#                         which the provider can no longer remove itself
#   * agentmachines       list to find the one whose agentRef names the Agent
#                         — the only link left once the provider starts
#                         unbinding — and get to confirm it went; delete one
#                         left with no Machine, patch to drop the provider's
#                         finalizer it would only drop through a Machine
#   * hostedclusters      list to find the HostedCluster by its control-plane
#                         namespace, get for its status.kubeconfig
#   * secrets             get the HostedCluster's admin kubeconfig. This is the
#                         widest grant in the chart: get on EVERY Secret of the
#                         MCE. Turn `rbac.hostedClusters` off on an MCE that
#                         runs no hosted clusters.
# update-nodepool uses the same grant: machines list + patch (find a NodePool's
# Machines, set and take off the `cluster.x-k8s.io/delete-machine` mark),
# hostedclusters get and the admin kubeconfig (rank the servers that leave), and:
#   * nodepools           get + list a HostedCluster's, in its namespace
#                         (read_hosted_cluster) — read only: a replicas change
#                         reaches a NodePool as a day1 commit Argo CD applies
# plus the Role below, on the Argo CD Applications that apply it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "slw.fullname" . }}-hosted-clusters
  labels:
    {{- include "slw.labels" . | nindent 4 }}
rules:
  - apiGroups: [cluster.x-k8s.io]
    resources: [machines]
    verbs: [get, list, delete, patch]
  - apiGroups: [capi-provider.agent-install.openshift.io]
    resources: [agentmachines]
    verbs: [get, list, delete, patch]
  - apiGroups: [hypershift.openshift.io]
    resources: [hostedclusters, nodepools]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "slw.fullname" . }}-hosted-clusters
  labels:
    {{- include "slw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "slw.fullname" . }}-hosted-clusters
subjects:
  - kind: ServiceAccount
    name: {{ include "slw.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# update-nodepool's sync (sync_argo_application): read the cluster's Application
# and sync it by patching its `operation` to exactly the day1 commit — only in
# Argo CD's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "slw.fullname" . }}-argo
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "slw.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "slw.fullname" . }}-argo
  namespace: {{ .Values.argo.namespace }}
  labels:
    {{- include "slw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "slw.fullname" . }}-argo
subjects:
  - kind: ServiceAccount
    name: {{ include "slw.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
