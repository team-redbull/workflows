# Static server for the docs site. Port 8080 because the container runs as an
# arbitrary non-root UID under OpenShift's restricted SCC — anything below 1024
# would need CAP_NET_BIND_SERVICE.
#
# This replaces the base image's default.conf; the surrounding http{} block
# (mime.types, sendfile, access_log to stdout) comes from the image's nginx.conf.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Kubernetes probes. Deliberately NOT a static file: it must answer even if
    # someone empties the site, so a broken build fails the probe instead of
    # serving blank pages.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets are cached for a year, because their URLs are versioned: every
    # reference in the HTML is /assets/<file>?v=__DOC_VERSION__, stamped with the
    # deployed image tag by 20-doc-version.sh. A redeploy therefore changes the
    # URL and the browser refetches immediately — strictly FRESHER than the 5
    # minutes this used to hold, which made a redeploy visible only eventually
    # while charging every page transition a revalidation round trip. Assets are
    # ~85 KB (the logo alone is 48 KB) against a ~200 ms RTT to the cluster, so
    # that was most of the cost of moving between two pages.
    #
    # NOTE the deliberate absence of add_header here, and below. nginx's
    # add_header does NOT inherit: a location that declares even one of its own
    # DROPS every add_header from the server block. Both locations used to set
    # Cache-Control that way, which is why none of the three security headers at
    # the bottom of this file were reaching a single page or asset. Expressing
    # the caching policy with `expires` instead leaves the inherited set intact —
    # so keep these blocks add_header-free.
    location /assets/ {
        expires 1y;
    }

    # Pages themselves are never cached: the whole point of the version in the
    # header is that what you are reading matches what is deployed. A negative
    # `expires` emits exactly `Cache-Control: no-cache` — same header as before,
    # without suppressing the inherited ones.
    location / {
        expires -1;
        # /segment-lifecycle/open-segment-rules -> …/open-segment-rules.html,
        # so links survive if someone drops the extension.
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip             on;
    gzip_types       text/plain text/css application/javascript image/svg+xml;
    gzip_min_length  1024;

    # This site is public-read documentation with no forms, no API and no
    # credentials — these just keep it from being framed or sniffed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}
