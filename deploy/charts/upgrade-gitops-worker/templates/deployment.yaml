apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ugw.fullname" . }}
  labels:
    {{- include "ugw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ugw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ugw.selectorLabels" . | nindent 8 }}
      annotations:
        # Settings are read once at import (fail-fast): a config change takes
        # effect through the rollout this checksum forces.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.temporal.tls.enabled }}
        checksum/temporal-ca: {{ include (print $.Template.BasePath "/temporal-tls-ca.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ugw.serviceAccountName" . }}
      # No Kubernetes API access at all: git hosts and registries only.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: upgrade-gitops-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No ports and no probes: the worker serves nothing. It dials out to
          # Temporal, and a worker that cannot reach it exits and restarts.
          envFrom:
            {{- with .Values.globalConfigMap }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            # Second, so a temporal.host rendered here wins over the global one.
            - configMapRef:
                name: {{ include "ugw.configName" . }}
          env:
            # Clones, oc's caches and Python's temp files: all on the emptyDir.
            - name: HOME
              value: /tmp
            - name: DAY1_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.day1.tokenSecret.name }}
                  key: {{ .Values.day1.tokenSecret.key }}
            {{- with .Values.day2.tokenSecret.name }}
            - name: DAY2_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.day2.tokenSecret.key }}
            {{- end }}
            {{- with .Values.brain.tokenSecret.name }}
            - name: BRAIN_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.brain.tokenSecret.key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.registry.authSecret.name }}
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
            {{- end }}
            {{- if .Values.temporal.tls.enabled }}
            - name: temporal-ca
              mountPath: /etc/temporal-tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.registry.authSecret.name }}
        - name: registry-auth
          secret:
            secretName: {{ . }}
            items:
              - key: {{ $.Values.registry.authSecret.key }}
                path: auth.json
        {{- end }}
        {{- if .Values.temporal.tls.enabled }}
        - name: temporal-ca
          configMap:
            name: {{ include "ugw.fullname" . }}-temporal-ca
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
