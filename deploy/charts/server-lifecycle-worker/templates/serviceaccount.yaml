{{- if .Values.serviceAccount.create }}
# The worker's identity on THIS cluster's API server — what replaces a
# kubeconfig. Its rights come only from the Roles in rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "slw.serviceAccountName" . }}
  labels:
    {{- include "slw.labels" . | nindent 4 }}
{{- end }}
