# The in-cluster git server: Gitea, from its public Helm chart, by Argo CD.
# It is the one Application that cannot come from the lab's own git repo.
#
# Needs, created by lab.sh BEFORE this is applied (a generated credential, so not in git):
#   Secret lab-git/gitea-admin   keys username, password
#
# In-cluster:  http://gitea-http.lab-git.svc.cluster.local:3000/<owner>/<repo>.git
# Route:       https://gitea-lab-git.<apps domain>/<owner>/<repo>.git   (edge TLS)
# Nothing is readable anonymously (REQUIRE_SIGNIN_VIEW, no registration, private repos).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-create-vm-git
  namespace: openshift-gitops
  labels:
    redbull.io/lab: create-vm
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: lab-create-vm
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.7.0
    helm:
      releaseName: gitea
      valuesObject:
        # restricted-v2: no pinned UID/fsGroup, the namespace's range is used.
        openshift:
          enabled: true
        # One pod, sqlite on its PVC: no database, no cache cluster.
        valkey-cluster:
          enabled: false
        valkey:
          enabled: false
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: false
        test:
          enabled: false
        persistence:
          size: 2Gi
        route:
          enabled: true
          # THIS cluster's apps domain: the one cluster-specific value of the lab
          # (here and in ROOT_URL below; lab.sh reads it back from the Route).
          host: gitea-lab-git.apps.cluster-qcl8n.dyn.redhatworkshops.io
          tls:
            termination: edge
            insecureEdgeTerminationPolicy: Redirect
        gitea:
          admin:
            existingSecret: gitea-admin
            email: lab-admin@redbull.invalid
            passwordMode: keepUpdated
          config:
            database:
              DB_TYPE: sqlite3
            session:
              PROVIDER: memory
            cache:
              ADAPTER: memory
            queue:
              TYPE: level
            server:
              DOMAIN: gitea-lab-git.apps.cluster-qcl8n.dyn.redhatworkshops.io
              ROOT_URL: https://gitea-lab-git.apps.cluster-qcl8n.dyn.redhatworkshops.io/
            service:
              DISABLE_REGISTRATION: true
              REQUIRE_SIGNIN_VIEW: true
            repository:
              DEFAULT_PRIVATE: private
              DEFAULT_BRANCH: main
              # `git push` to a repository that does not exist creates it (private).
              ENABLE_PUSH_CREATE_USER: true
              ENABLE_PUSH_CREATE_ORG: true
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        redbull.io/lab: create-vm
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
