{{- if .Values.serviceAccount.create }}
# An identity with no rights: the worker never calls a Kubernetes API, and
# the Deployment mounts no token for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ugw.serviceAccountName" . }}
  labels:
    {{- include "ugw.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
